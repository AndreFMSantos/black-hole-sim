name: core tests (CPU)
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: dependencies (GLFW needs the X11/Wayland headers even when only the core is built)
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev libwayland-dev libxkbcommon-dev wayland-protocols
      - name: configure (no CUDA on the runner: only the CPU apps and the core library)
        run: cmake -S code -B code/build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: build the core tests
        run: cmake --build code/build --target bhs_core_tests
      - name: run
        run: code/build/core/bhs_core_tests
